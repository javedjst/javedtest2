name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: aiworkhub }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aiworkhub
      DATABASE_URL: postgres://aiwork_app:aiwork_app_dev@localhost:5432/aiworkhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run migrate
      - run: npm run typecheck
      - run: TEST_DB=1 npm test
      - run: npm run build -w apps/web
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
